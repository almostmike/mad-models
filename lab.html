<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Lab</title>
    <style>
      :root { color-scheme: light; }
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f3ec; color: #222; }
      main { max-width: 860px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
      textarea { width: 100%; min-height: 90px; font: 15px/1.4 ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
      #out { white-space: pre-wrap; font: 15px/1.5 ui-monospace, monospace; background: #fff; border: 1px solid #ccc; padding: 12px; min-height: 120px; }
      #out .gen { color: #0b5d5d; }
      #status { font-size: 13px; color: #555; }
      progress { width: 220px; }
      button { font: inherit; padding: 6px 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Model Lab</h1>
      <p id="status">Detecting device…</p>
      <div class="row">
        <label>Model <select id="model"><option value="gpt1">GPT-1 (2018)</option><option value="gpt2">GPT-2 (2019)</option></select></label>
        <label>Mode <select id="mode"><option value="webgpu">Live: WebGPU</option><option value="wasm">Live: CPU</option><option value="archive">Archive</option></select></label>
        <button id="load">Load</button>
        <progress id="prog" value="0" max="1"></progress>
      </div>
      <textarea id="prompt">It was a dark and stormy night, and she</textarea>
      <div class="row">
        <label>Temperature <input id="temp" type="range" min="0.1" max="2" step="0.1" value="0.8" /> <span id="tempv">0.8</span></label>
        <label>Length <input id="len" type="number" min="5" max="200" value="60" /></label>
        <label><input id="sample" type="checkbox" checked /> sample</label>
        <select id="card" hidden></select>
        <button id="go">Generate</button>
        <button id="stop">Stop</button>
      </div>
      <div id="out"></div>
      <p id="stats"></p>
    </main>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
