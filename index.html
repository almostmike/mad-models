<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prompt three real language models from three eras of AI: ELIZA (1966), GPT-1 (2018) and GPT-2 (2019)." />
    <title>Mad Models</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="app">
      <div class="paper" id="paper">
        <pre id="printout" aria-hidden="true"></pre>
        <form id="line" class="line" autocomplete="off">
          <label for="entry" class="sr-only">Type to ELIZA, then press Enter</label>
          <input id="entry" name="entry" type="text" spellcheck="false" maxlength="200" disabled />
        </form>
      </div>
      <p id="spoken" class="sr-only" aria-live="polite"></p>
      <p class="note">Mad Models is under construction. This is the real 1966 ELIZA running the DOCTOR script. Type and press Enter.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
